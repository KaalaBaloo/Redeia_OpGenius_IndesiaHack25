<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeia - OpGenius</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css"> 
</head>
<body>

    <div class="top-bar">
        <div class="brand-left">
            <a href="../html/bot.html">
                <img src="../media/icons/BotIcon.png" alt="Bot Icon" style="height:30px; cursor:pointer;">
            </a>
        </div>

        <div class="brand-right">
            <img src="../media/redeia/top.png" alt="Top Image" style="height:30px;">
        </div>
    </div>

    <header>
        <div class="logo-container">
            <a href="../../Home _ Redeia.html">
                <img src="../media/redeia/logoRedeia.svg" alt="Redeia Logo" style="height:25px; cursor:pointer;">
            </a>
        </div>

        <nav class="main-nav">
            <ul class="nav-links">
                <li><a href="#">Conócenos <i class="fas fa-chevron-down"></i></a></li>
                <li><a href="#">Nuestros servicios <i class="fas fa-chevron-down"></i></a></li>
                <li><a href="#">Sostenibilidad <i class="fas fa-chevron-down"></i></a></li>
                <li><a href="#">Empleo <i class="fas fa-chevron-down"></i></a></li>
                <li><a href="#">Sala de prensa <i class="fas fa-chevron-down"></i></a></li>
                <li><a href="../html/opgenius.html">OpGenius <i class="fas fa-chevron-down"></i></a></li>
            </ul>

            <div class="nav-actions">
                <i class="fas fa-comments fa-lg" style="color: var(--primary-blue); cursor:pointer;"></i>
                <i class="fas fa-search fa-lg" style="color: var(--primary-blue); cursor:pointer;"></i>
                <div class="lang-switch">
                    <span class="active">ES</span> | <span>EN</span>
                </div>
            </div>
        </nav>
    </header>


    <div class="breadcrumb">
        Inicio <span>&gt;</span> OpGenius <span>&gt;</span> Sala de Estudio <span>&gt;</span> Autoevaluación
    </div>

    <section class="hero">
        <div class="hero-title-bar">
            Autoevaluación
        </div>
    </section>

    <div class="container" style="margin-top: 50px; margin-bottom: 50px;">
        <div class="quiz">
            <div class="card">
                <div class="header">
                    <div class="circle" id="question-number">?</div>
                    <h1 id="quiz-topic">Cargando Tópico...</h1>
                </div>

                <div id="loading-message" class="alert alert-info text-center" role="alert">
                    Generando pregunta con el LLM...
                </div>
                
                <div id="quiz-content">
                    </div>

                <div class="d-grid gap-2 mt-4">
                    <button id="next-question-btn" class="btn btn-primary" style="display:none;">
                        Siguiente Pregunta
                    </button>
                </div>
                
            </div>
            </div>
    </div>

    <footer>
        <div class="footer-content">
            <img src="../media/redeia/footer.png" alt="Redeia Logo" style="height:630px; cursor:pointer;">
            <img src="../media/redeia/footer2.png" alt="Redeia Logo" style="height:50px; cursor:pointer; display: block; margin: 0 auto;">
        </div>
    </footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/quiz_llm.js"></script> 

</body>
</html>
